apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: auto-pe-sibling-subject-rw
on:
  workflow_call:
    outputs:
      policy-subject:
        description: Generated policy subject JSON
        value: ${{ jobs.generate.outputs.policy-subject }}
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  generate:
    outputs:
      policy-subject: ${{ steps.make-input.outputs.policy-subject }}
    steps:
      - id: make-input
        name: Build a test policy subject
        uses: docker://alpine:latest
        shell: sh
        run: |
          CRITICAL=0
          HIGH=0
          MEDIUM=5
          LOW=10
          TOTAL=$(( $CRITICAL + $HIGH + $MEDIUM + $LOW ))
          cat > "$CLOUDBEES_OUTPUTS/policy-subject" << EOF
          [{
            "type": "vulnerability_scan",
            "data": {
              "summary": {
                "by_severity": {
                  "total": ${TOTAL},
                  "critical": ${CRITICAL},
                  "high": ${HIGH},
                  "medium": ${MEDIUM},
                  "low": ${LOW}
                }
              }
            },
            "meta":[{
              "tool": "something"
            }]
          }]
          EOF
