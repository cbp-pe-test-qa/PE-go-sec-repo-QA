apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: auto-pe-staged-rw-caller_latest
on:
  workflow_dispatch:
metadata:
  stages/v1alpha1:
    - name: ReUsable stage
      jobs:
        - call-reusable
        - independent-job
    - name: Post Stage
      jobs:
        - post-rw-job
jobs:
  call-reusable:
    uses: .cloudbees/workflows/auto-pe-reusable-wf_latest.yaml
  independent-job:
    steps:
      - run: echo "independent job — no dependency on call-reusable"
        uses: docker://golang:1.20.3-alpine3.17
        name: Independent step
        shell: sh
  post-rw-job:
    needs:
      - call-reusable
      - independent-job
    steps:
      - run: ' echo "post stage — only runs if call-reusable succeeded"'
        uses: docker://golang:1.20.3-alpine3.17
        name: Post RW step
        shell: sh
